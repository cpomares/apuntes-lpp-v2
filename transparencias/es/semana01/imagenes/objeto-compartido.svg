<svg xmlns="http://www.w3.org/2000/svg" width="536" height="310" viewBox="0 0 536 310" role="img" aria-labelledby="title desc">
<title id="title">Dos referencias, un solo objeto</title>
<desc id="desc">p1 y p2 apuntan al mismo objeto Point2D. Su coordenada x cambia de 3.0 a 10.0; la coordenada y sigue siendo 2.0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#282824" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
<g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#282824">
<g font-family="Menlo, Consolas, monospace" font-size="28"><text x="24" y="95">p1</text><text x="24" y="225">p2</text></g>
<g fill="none" stroke="#282824" stroke-width="2.5" marker-end="url(#arrow)"><path d="M75 87 L212 145"/><path d="M75 217 L212 173"/></g>
<rect x="222" y="38" width="286" height="214" rx="10" fill="#fffaf1" stroke="#282824" stroke-width="2"/>
<path d="M223 99 H507" stroke="#d9d2c6" stroke-width="2"/>
<path d="M223 100 H507 V182 H223Z" fill="#f4e8c9"/>
<text x="365" y="78" text-anchor="middle" font-size="29" font-weight="600">Point2D</text>
<g font-family="Menlo, Consolas, monospace" font-size="27"><text x="243" y="151">x:</text><text x="295" y="151" fill="#777269">3.0</text><path d="M292 141 H348" stroke="#777269" stroke-width="2"/><text x="359" y="151">→</text><text x="399" y="151" font-weight="700">10.0</text><text x="243" y="224">y: 2.0</text></g>
<text x="280" y="293" text-anchor="middle" font-size="23" fill="#626366">Dos referencias, un solo objeto</text>
</g></svg>
